name: Improve C2 projection layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorganize projection dashboard
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/index.html')
          text = p.read_text(encoding='utf-8')

          css = '''
          /* C2 PROJECTION PRIORITY */
          #admin>.c2-header{padding:20px 24px}
          #admin>.c2-header h1{font-size:clamp(28px,3.5vw,48px);margin:10px 0 4px}
          .c2-priority{display:grid;grid-template-columns:minmax(420px,1fr) minmax(480px,1.35fr);gap:16px;align-items:stretch}
          .c2-priority>.card{margin:0}
          .c2-priority .rank{min-height:100%}
          .c2-priority .rank h2{font-size:20px;letter-spacing:3px}
          .c2-priority .rank table{font-size:16px}
          .c2-priority .rank th{font-size:12px;padding:12px 10px}
          .c2-priority .rank td{padding:18px 10px;border-top:1px solid #0b3340}
          .c2-priority .rank tr:first-child td:first-child{font-size:28px}
          .c2-priority .rank tr:first-child td b{font-size:19px}
          .c2-priority .rank .bar{height:15px}
          .c2-priority .rank small{font-size:12px}
          .c2-clock .clock-value{font-size:clamp(34px,4vw,60px)}
          .projection-grid{margin-top:16px}
          .projection-grid .signal-panel{min-height:135px}
          #feed{max-height:190px}
          .c2-header .grid{grid-template-columns:repeat(4,1fr)}
          .c2-header .metric{padding:12px 14px}
          .c2-header .big{font-size:32px}
          @media(max-width:1000px){.c2-priority{grid-template-columns:1fr}.c2-header .grid{grid-template-columns:repeat(2,1fr)}}
          @media(max-width:650px){.c2-header .grid{grid-template-columns:1fr}}
          '''
          marker = '@media(max-width:850px)'
          if '/* C2 PROJECTION PRIORITY */' not in text:
              text = text.replace(marker, css + '\n' + marker, 1)

          header_old = '<div class="card"><div class="corner"><div><span class="tag">WAZOWSKI // COMMAND CENTER</span>'
          header_new = '<div class="card c2-header"><div class="corner"><div><span class="tag">WAZOWSKI // C2 COMMAND CENTER</span>'
          text = text.replace(header_old, header_new, 1)

          start = text.find('<div class="card"><div class="corner"><h2>◉ CTF COMMAND CLOCK</h2>')
          rank_start = text.find('<div class="card rank">', start)
          if start == -1 or rank_start == -1:
              raise SystemExit('Could not locate command clock / leaderboard blocks')

          rank_end_marker = '''</div>
<div class="card"><div class="corner"><h2>// LIVE EVENT STREAM'''
          rank_end = text.find(rank_end_marker, rank_start)
          if rank_end == -1:
              raise SystemExit('Could not locate leaderboard end')
          rank_end += len('</div>')

          priority = text[start:rank_end]
          priority = priority.replace('<div class="card"><div class="corner"><h2>◉ CTF COMMAND CLOCK</h2>', '<div class="card c2-clock"><div class="corner"><h2>◉ CTF COMMAND CLOCK</h2>', 1)
          priority = priority.replace('<div class="card rank">', '<div class="card rank c2-leaderboard">', 1)
          priority = priority.replace('<h2>◈ LIVE LEADERBOARD</h2>', '<h2>◈ LIVE LEADERBOARD // C2 PRIORITY</h2>', 1)
          priority = '<div class="c2-priority">\n' + priority + '\n</div>'

          text = text[:start] + priority + text[rank_end:]
          p.write_text(text, encoding='utf-8')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Apply C2 projection layout" || true
          git push
          rm -f .github/workflows/projection-layout.yml
          git add .github/workflows/projection-layout.yml
          git commit -m "Remove temporary projection workflow" || true
          git push
