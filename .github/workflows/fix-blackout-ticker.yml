name: Fix Blackout ticker
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[blackout-ticker]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ticker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('ctf-dicib/blackout.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.track{display:flex;width:max-content;animation:move 38s linear infinite}', '.track{display:flex;width:max-content;animation:move 55s linear infinite;will-change:transform}')
          s=s.replace('.loginBoard{width:min(1200px,100%);margin:28px auto}', '.loginBoard{position:fixed;left:0;right:0;bottom:0;z-index:60;width:auto;margin:0;padding:0 25px 14px;background:linear-gradient(transparent,#050505 30%)}')
          s=s.replace('.app{display:none;padding:20px 0 70px}', '.app{display:none;padding:20px 0 115px}')
          s=s.replace('.mainBoard{margin:18px 0}', '.mainBoard{position:fixed;left:0;right:0;bottom:0;z-index:40;width:100%;margin:0;border-left:0;border-right:0;border-bottom:0;box-shadow:0 -18px 35px #050505aa}')
          s=s.replace('function renderBoards(){const html=cards();$(\'track\').innerHTML=html;$(\'loginTrack\').innerHTML=html;', 'function renderBoards(){const html=cards();const t=$(\'track\'),l=$(\'loginTrack\');if(t.innerHTML!==html)t.innerHTML=html;if(l.innerHTML!==html)l.innerHTML=html;')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ctf-dicib/blackout.html
          git diff --cached --quiet || git commit -m "fix: sports-style blackout ticker [blackout-ticker]"
          git push