      - name: Self-test Blackout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ctf-dicib/blackout.html').read_text(encoding='utf-8')
          start=s.index('<script>')+8; end=s.rindex('</script>')
          Path('/tmp/blackout.js').write_text(s[start:end],encoding='utf-8')
          checks={
            '14 operators':s.count('DICIB-')>=14,
            '33 missions':s.count("['")>=33,
            'mission inputs':'class="input flagInput"' in s,
            'validation handler':'function check(id)' in s and 'data-check' in s,
            'enter submits':"classList.contains('flagInput')" in s,
            'ranking duplicate':'const html=cards()+cards()' in s,
            'ranking animation':'@keyframes move' in s and 'translateX(-50%)' in s,
            'ranking names':'loginTrack' in s and 'track' in s,
            'penalty':'s.score=Math.max(0,s.score-25)' in s,
            'reward':'s.score+=100' in s,
            'personal flags':'function flagFor(pid,id)' in s
          }
          print(checks)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('BLACKOUT SELF-TEST FAILED: '+', '.join(bad))
          PY
          node --check /tmp/blackout.js
      - name: Commit repaired page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ctf-dicib/blackout.html
          git diff --cached --quiet || git commit -m "fix: repair Blackout missions and live ranking [blackout-repair]"
          git push
