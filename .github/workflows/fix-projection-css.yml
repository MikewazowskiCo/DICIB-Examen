name: Fix projection CSS cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean malformed legacy media rule
        shell: bash
        run: |
          echo '' | base64 -d | python
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Fix C2 projection CSS" || true
          git push
          rm -f .github/workflows/fix-projection-css.yml
          git add .github/workflows/fix-projection-css.yml
          git commit -m "Remove temporary CSS workflow" || true
          git push
