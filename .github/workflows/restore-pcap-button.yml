name: Restore PCAP download button
on:
  push:
    paths:
      - '.github/workflows/restore-pcap-button.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore button only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- PCAP DOWNLOAD BUTTON -->'
          css='''\n.pcap-download{margin:20px auto 0;max-width:680px;padding:16px;border:1px solid #0b5870;background:rgba(0,10,16,.72);box-shadow:inset 0 0 24px rgba(0,229,255,.04)}\n.pcap-download a{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:min(520px,100%);padding:16px 20px;border:1px solid var(--cyan);color:var(--cyan);background:#02070b;text-decoration:none;text-transform:uppercase;letter-spacing:2px;font-weight:900;box-shadow:0 0 18px rgba(0,229,255,.12);transition:.2s}\n.pcap-download a:hover{color:var(--green);border-color:var(--green);box-shadow:0 0 24px rgba(85,255,154,.2);transform:translateY(-1px)}\n.pcap-download small{display:block;margin-top:9px;color:var(--muted);font-size:10px;letter-spacing:1px}\n'''
          html='''<!-- PCAP DOWNLOAD BUTTON -->\n<div class="pcap-download"><a href="/pcap/DICIB-CAPTURE.pcap" download="DICIB-CAPTURE.pcap">[ ↓ DESCARGAR CAPTURA DE TRÁFICO ]</a><small>ARCHIVO DE EVIDENCIA · DICIB-CAPTURE.pcap · ABRIR CON WIRESHARK</small></div>\n'''
          if marker not in s:
              s=s.replace('</style>',css+'</style>',1)
              anchor='</section>\n<section id="team"'
              if anchor not in s:
                  raise SystemExit('Anchor not found; aborting without changes')
              s=s.replace(anchor,'</section>\n'+html+'<section id="team"',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then echo 'No change needed'; else git commit -m 'Restore PCAP download button'; fi
          git rm .github/workflows/restore-pcap-button.yml
          git commit -m 'Remove temporary PCAP button workflow'
          git push
# trigger
