name: Add Blackout operator passwords
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[blackout-passwords]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login credentials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ctf-dicib/blackout.html')
          s=p.read_text(encoding='utf-8')
          css='.start:disabled{opacity:.35;cursor:not-allowed}'
          if '.passwordBox{' not in s:
              s=s.replace(css,css+'.passwordBox{margin-top:10px}.passwordMsg{min-height:18px;margin-top:6px;font:10px monospace}.passwordMsg.good{color:var(--l)}.passwordMsg.bad{color:var(--r)}')
          old='<button class="start" id="start" disabled>SELECCIONA UN OPERADOR</button>'
          new='<div class="passwordBox"><div class="ey">CREDENCIAL // ACCESO INDIVIDUAL</div><input class="input" id="password" type="password" autocomplete="off" placeholder="Introduce tu contraseña"><div class="passwordMsg" id="passwordMsg"></div></div><button class="start" id="start" disabled>INTRODUCE LA CONTRASEÑA</button>'
          if 'id="password"' not in s:
              s=s.replace(old,new)
          marker="const phases={"
          creds="const credentials={'DICIB-01':'K7vQ2mR9','DICIB-02':'N4xT8pL2','DICIB-03':'R9cW5nH7','DICIB-04':'B6mZ3qK8','DICIB-05':'T2fJ9vP4','DICIB-06':'Y8rD4sM6','DICIB-07':'H3kN7wQ5','DICIB-08':'P5xC2tV9','DICIB-09':'G7mR4zL8','DICIB-10':'W2qF9nK6','DICIB-11':'J8vS3pX5','DICIB-12':'C4tM7yR2','DICIB-13':'Z9nH5kD3','DICIB-14':'L6pQ8wT4'};"
          if 'const credentials=' not in s:
              s=s.replace(marker,creds+marker)
          oldjs="$('ops').addEventListener('click',e=>{const b=e.target.closest('.op');if(!b)return;document.querySelectorAll('.op').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');current=players.find(p=>p[0]===b.dataset.id);$('start').disabled=false;$('start').textContent='INICIAR OPERACIÓN // '+current[0]+' →';renderBoards()});"
          newjs="$('ops').addEventListener('click',e=>{const b=e.target.closest('.op');if(!b)return;document.querySelectorAll('.op').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');current=players.find(p=>p[0]===b.dataset.id);$('password').value='';$('passwordMsg').textContent='';$('passwordMsg').className='passwordMsg';$('start').disabled=true;$('start').textContent='INTRODUCE LA CONTRASEÑA';renderBoards()});$('password').addEventListener('input',()=>{if(!current)return;const ok=$('password').value===credentials[current[0]];$('start').disabled=!ok;$('start').textContent=ok?'INICIAR OPERACIÓN // '+current[0]+' →':'CONTRASEÑA REQUERIDA';$('passwordMsg').textContent=$('password').value?(ok?'✓ CREDENCIAL VALIDADA':'✕ CONTRASEÑA INCORRECTA'):'';$('passwordMsg').className='passwordMsg '+(ok?'good':'bad')});$('password').addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('start').disabled)$('start').click()});"
          if "$('password').addEventListener('input'" not in s:
              s=s.replace(oldjs,newjs)
          oldstart="$('start').addEventListener('click',()=>{if(!current)return;$('login').style.display='none';$('app').style.display='block';render()});"
          newstart="$('start').addEventListener('click',()=>{if(!current||$('password').value!==credentials[current[0]])return;$('login').style.display='none';$('app').style.display='block';render()});"
          s=s.replace(oldstart,newstart)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ctf-dicib/blackout.html
          git diff --cached --quiet || git commit -m "feat: individual operator credentials [blackout-passwords]"
          git push
