<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DICIB // OPERATION BLACKOUT</title><script>(async()=>{const b=await fetch("blackout.payload.b64?"+Date.now()).then(r=>{if(!r.ok)throw Error("PAYLOAD "+r.status);return r.text()});const bin=Uint8Array.from(atob(b.replace(/\s/g,"")),c=>c.charCodeAt(0));const out=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();document.open();document.write(out);document.close()})().catch(e=>document.body.textContent="BLACKOUT LOAD ERROR: "+e)</script>
