<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DICIB // OPERATION BLACKOUT</title><script>(async()=>{const r=await fetch("blackout.payload.b64?"+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("PAYLOAD "+r.status);const bin=await r.arrayBuffer();const out=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();document.open();document.write(out);document.close()})().catch(e=>document.body.textContent="BLACKOUT LOAD ERROR: "+e)</script>
